name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: viir_portfolio.settings
      SECRET_KEY: ci-insecure-key-for-testing-only
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest pytest-django pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Audit dependencies for known CVEs
        run: pip-audit --strict
        continue-on-error: true

      - name: Check formatting with black
        run: black --check .

      - name: Lint with flake8
        run: flake8 . --count --show-source --statistics

      - name: Verify no uncommitted migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django system check
        run: python manage.py check

      - name: Run tests with pytest
        run: pytest --tb=short
