{% load static %}
    <section id="insights" class="br-portfolio padding-tb-80">
        <div class="container">
            <div class="section-title reveal-up">

                <span class="ligh-title">Insights</span>
            </div>
            <!-- Dynamic grid of latest 3 blogs -->
            <div class="blogs-grid reveal-stagger" id="blogsGrid">
                {% for blog in article|slice:":3" %}
                <a href="{% url 'detail_blog' blog.slug %}" class="blog-card-link">
                    <div class="blog-card reveal-stagger-child blog-card-visible">
                        <div class="blog-card-image" data-bg="{% if blog.image %}{{ blog.image.url }}{% else %}{% static 'img/default-blog-image.png' %}{% endif %}"></div>
                        <div class="blog-card-content">
                            <h3>{{ blog.title }}</h3>
                            <p class="blog-excerpt">{{ blog.content|striptags|truncatechars:120 }}</p>
                            <div class="blog-meta">
                                <div class="author-info">
                                    {% if blog.likes == 1 %}
                                    <span>{{ blog.likes }} person likes this post</span>
                                    {% else %}
                                    <span>{{ blog.likes }} people like this post</span>
                                    {% endif %}
                                </div>
                                <span>{{ blog.date }}</span>
                            </div>
                        </div>
                    </div>
                </a>
                {% endfor %}
            </div>
            <div class="text-center">
                <a href="{% url 'blogspace' %}" class="capsule-btn">
                    <span class="text">View More</span>
                </a>
            </div>
        </div>
    </section>
    <!-- Blog Section End -->
