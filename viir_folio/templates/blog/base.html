<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://bootswatch.com/5/simplex/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <title>Django Blog</title>

  <!-- Blog Styles -->
  <link rel="stylesheet" href="{% static 'css/blog-styles.css' %}">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/blog-base.css' %}">

</head>

<body>

  <!-- ============================================================ -->
  <!-- HEADER / NAVBAR -->
  <!-- ============================================================ -->
  <header class="blog-header">
    <nav class="blog-navba">
      <div class="nav-container">
        <!-- Brand / Title -->
        <h4 id="headish" class="blog-header-title">VIIR PHURIA &nbsp;&nbsp; BlogSpace</h4>

        <!-- Premium segmented nav pill -->
        <div class="blog-nav">
          <a href="/#blog" class="blog-nav__link">
            <i class="fas fa-house"></i><span>Home</span>
          </a>
          <a href="/blogspace" class="blog-nav__link blog-nav__link--active">
            <i class="fas fa-newspaper"></i><span>BlogSpace</span>
          </a>
          <a href="/edit" class="blog-nav__link">
            <i class="fas fa-pen"></i><span>Write</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <!-- ============================================================ -->
  <!-- CONTENT BLOCK -->
  <!-- ============================================================ -->
  {% block content %}
  {% endblock content %}

  <!-- ============================================================ -->
  <!-- VENDOR JS -->
  <!-- ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
    integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD"
    crossorigin="anonymous"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!-- Custom JS -->
  <script src="{% static 'js/blog-base.js' %}"></script>
  <script src="{% static 'js/blog-script.js' %}"></script>

</body>

</html>
