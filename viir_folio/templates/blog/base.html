<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://bootswatch.com/5/simplex/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
    rel="stylesheet">

  <title>Django Blog</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

  <!-- Blog Styles -->
  <link rel="stylesheet" href="{% static 'css/blog-styles.css' %}">

  <!-- Page Styles -->
  <link rel="stylesheet" href="{% static 'css/blog-index2.css' %}">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/blog-base.css' %}">

  <!-- Override Bootstrap Typography Defaults -->
  <style>
    html,
    body {
      margin: 0 !important;
      padding: 0 !important;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      background-color: var(--bg-color, #f8fafc) !important;
      color: var(--text-color, #333) !important;
      transition: background-color 0.3s, color 0.3s;
      overflow: hidden;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    p,
    form {
      font-family: 'Quicksand', sans-serif !important;
      font-weight: 600 !important;
      color: var(--text-color, #333) !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Navbar brand: restore Playfair Display — overrides the h4 rule above */
    #headish,
    .bi2-headish {
      font-family: 'Playfair Display', serif !important;
      font-weight: 500 !important;
      color: white !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    body.dark {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: #222;
      --border-color: #334155;
    }

    body.dark h1,
    body.dark h2,
    body.dark h3,
    body.dark h4,
    body.dark h5,
    body.dark h6 {
      color: #f8fafc !important;
    }

    /* Keep navbar brand always white regardless of theme */
    body.dark #headish,
    body.dark .bi2-headish {
      color: white !important;
    }
  </style>


  <!-- Theme Initialization -->
  <script>
    (function () {
      const isDarkMode = localStorage.getItem('darkMode') === 'true';
      window.__theme = isDarkMode ? 'dark' : 'light';
      window.__isDarkMode = isDarkMode;
    })();
  </script>
</head>

<body>
  <!-- Apply theme class immediately before any rendering -->
  <script>document.body.classList.add(window.__theme || 'dark');</script>

  <!-- ============================================================ -->
  <!-- HEADER / NAVBAR -->
  <!-- ============================================================ -->
  <header class="blog-header">
    <nav class="blog-navba">
      <div class="nav-container">
        <!-- Brand / Title -->
        <div class="logo bi2-logo">
          <span>BlogSpace</span>
        </div>
        <h4 id="headish" class="bi2-headish">Viir Phuria &nbsp;<span style="font-size: 0.8em; opacity: 0.85;">·&nbsp;
            BlogSpace</span></h4>

        <!-- Theme Toggle -->
        <div id="mytoggle" class="bi2-toggle-wrapper"
          style="position: absolute; right: 380px; top: 50%; transform: translateY(-50%); z-index: 1005;">
          <label id="theme-toggle-button" class="bi2-toggle-label" title="Toggle Dark/Light Mode">
            <input type="checkbox" id="toggle">
            <svg class="bi2-toggle-svg" onclick="toggleStyles(event)" viewBox="0 0 69.667 44"
              xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg">
              <g transform="translate(3.5 3.5)" data-name="Component 15 – 1" id="Component_15_1">
                <g filter="url(#container)" transform="matrix(1, 0, 0, 1, -3.5, -3.5)">
                  <rect fill="#83cbd8" transform="translate(3.5 3.5)" rx="17.5" height="35" width="60.667"
                    data-name="container" id="container"></rect>
                </g>
                <g transform="translate(2.333 2.333)" id="button">
                  <g data-name="sun" id="sun">
                    <g filter="url(#sun-outer)" transform="matrix(1, 0, 0, 1, -5.83, -5.83)">
                      <circle fill="#f8e664" transform="translate(5.83 5.83)" r="15.167" cy="15.167" cx="15.167"
                        data-name="sun-outer" id="sun-outer-2"></circle>
                    </g>
                    <g transform="matrix(1, 0, 0, 1, -5.83, -5.83)">
                      <path fill="rgba(246,254,247,0.29)" transform="translate(9.33 9.33)"
                        d="M11.667,0A11.667,11.667,0,1,1,0,11.667,11.667,11.667,0,0,1,11.667,0Z" data-name="sun-path"
                        id="sun-3"></path>
                    </g>
                    <circle fill="#fcf4b9" transform="translate(8.167 8.167)" r="7" cy="7" cx="7" id="sun-inner">
                    </circle>
                  </g>
                  <g data-name="moon" id="moon">
                    <g filter="url(#moon)" transform="matrix(1, 0, 0, 1, -31.5, -5.83)">
                      <circle fill="#cce6ee" transform="translate(31.5 5.83)" r="15.167" cy="15.167" cx="15.167"
                        data-name="moon" id="moon-3"></circle>
                    </g>
                    <g fill="#a6cad0" transform="translate(-24.415 -1.009)" id="patches">
                      <circle transform="translate(43.009 4.496)" r="2" cy="2" cx="2"></circle>
                      <circle transform="translate(39.366 17.952)" r="2" cy="2" cx="2" data-name="patch"></circle>
                      <circle transform="translate(33.016 8.044)" r="1" cy="1" cx="1" data-name="patch"></circle>
                      <circle transform="translate(51.081 18.888)" r="1" cy="1" cx="1" data-name="patch"></circle>
                      <circle transform="translate(33.016 22.503)" r="1" cy="1" cx="1" data-name="patch"></circle>
                      <circle transform="translate(50.081 10.53)" r="1.5" cy="1.5" cx="1.5" data-name="patch"></circle>
                    </g>
                  </g>
                </g>
                <g filter="url(#cloud)" transform="matrix(1, 0, 0, 1, -3.5, -3.5)">
                  <path fill="#fff" transform="translate(-3466.47 -160.94)"
                    d="M3512.81,173.815a4.463,4.463,0,0,1,2.243.62.95.95,0,0,1,.72-1.281,4.852,4.852,0,0,1,2.623.519c.034.02-.5-1.968.281-2.716a2.117,2.117,0,0,1,2.829-.274,1.821,1.821,0,0,1,.854,1.858c.063.037,2.594-.049,3.285,1.273s-.865,2.544-.807,2.626a12.192,12.192,0,0,1,2.278.892c.553.448,1.106,1.992-1.62,2.927a7.742,7.742,0,0,1-3.762-.3c-1.28-.49-1.181-2.65-1.137-2.624s-1.417,2.2-2.623,2.2a4.172,4.172,0,0,1-2.394-1.206,3.825,3.825,0,0,1-2.771.774c-3.429-.46-2.333-3.267-2.2-3.55A3.721,3.721,0,0,1,3512.81,173.815Z"
                    data-name="cloud" id="cloud"></path>
                </g>
                <g fill="#def8ff" transform="translate(3.585 1.325)" id="stars">
                  <path transform="matrix(-1, 0.017, -0.017, -1, 24.231, 3.055)"
                    d="M.774,0,.566.559,0,.539.458.933.25,1.492l.485-.361.458.394L1.024.953,1.509.592.943.572Z"></path>
                  <path transform="matrix(-0.777, 0.629, -0.629, -0.777, 23.185, 12.358)"
                    d="M1.341.529.836.472.736,0,.505.46,0,.4.4.729l-.231.46L.605.932l.4.326L.9.786Z" data-name="star">
                  </path>
                  <path transform="matrix(0.438, 0.899, -0.899, 0.438, 23.177, 29.735)"
                    d="M.015,1.065.475.9l.285.365L.766.772l.46-.164L.745.494.751,0,.481.407,0,.293.285.658Z"
                    data-name="star"></path>
                  <path transform="translate(12.677 0.388) rotate(104)"
                    d="M1.161,1.6,1.059,1,1.574.722.962.607.86,0,.613.572,0,.457.446.881.2,1.454l.516-.274Z"
                    data-name="star"></path>
                  <path transform="matrix(-0.07, 0.998, -0.998, -0.07, 11.066, 15.457)"
                    d="M.873,1.648l.114-.62L1.579.945,1.03.62,1.144,0,.706.464.157.139.438.7,0,1.167l.592-.083Z"
                    data-name="star"></path>
                  <path transform="translate(8.326 28.061) rotate(11)"
                    d="M.593,0,.638.724,0,.982l.7.211.045.724.36-.64.7.211L1.342.935,1.7.294,1.063.552Z"
                    data-name="star"></path>
                  <path transform="translate(5.012 5.962) rotate(172)"
                    d="M.816,0,.5.455,0,.311.323.767l-.312.455.516-.215.323.456L.827.911,1.343.7.839.552Z"
                    data-name="star"></path>
                  <path transform="translate(2.218 14.616) rotate(169)"
                    d="M1.261,0,.774.571.114.3.487.967,0,1.538.728,1.32l.372.662.047-.749.728-.218L1.215.749Z"
                    data-name="star"></path>
                </g>
              </g>
            </svg>
          </label>
        </div>

        <!-- Premium segmented nav pill -->
        <div class="blog-nav">
          <a href="/#blog" class="blog-nav__link">
            <i class="fas fa-house"></i><span>Home</span>
          </a>
          <a href="{% url 'blogspace' %}"
            class="blog-nav__link {% if request.resolver_match.url_name == 'blogspace' or request.resolver_match.url_name == 'detail_blog' %}blog-nav__link--active{% endif %}">
            <i class="fas fa-newspaper"></i><span>BlogSpace</span>
          </a>
          <a href="{% url 'login' %}"
            class="blog-nav__link {% if request.resolver_match.url_name in 'login,create_blog,updateview,delete_article' %}blog-nav__link--active{% endif %}">
            <i class="fas fa-pen"></i><span>Write</span>
          </a>
        </div>

        <!-- Mobile Hamburger Menu -->
        <div class="hamburger">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>

      </div>
    </nav>
  </header>

  <!-- ============================================================ -->
  <!-- CONTENT BLOCK -->
  <!-- ============================================================ -->
  {% block content %}
  {% endblock content %}

  <!-- ============================================================ -->
  <!-- VENDOR JS -->
  <!-- ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
    integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD"
    crossorigin="anonymous"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!-- Custom JS -->
  <script src="{% static 'js/blog-index2.js' %}"></script>
  <script src="{% static 'js/blog-base.js' %}"></script>
  <script src="{% static 'js/blog-script.js' %}"></script>

  <!-- Theme application immediately after load -->
  <script>
    document.body.classList.remove("body-default");
    document.body.classList.add(window.__theme || 'dark');
  </script>
</body>

</html>
