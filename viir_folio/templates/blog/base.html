<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://bootswatch.com/5/simplex/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <title>Django Blog</title>

  <!-- Blog Styles -->
  <link rel="stylesheet" href="{% static 'css/blog-styles.css' %}">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/blog-base.css' %}">

</head>

<body>

  <!-- ============================================================ -->
  <!-- HEADER / NAVBAR -->
  <!-- ============================================================ -->
  <header class="header blog-header">
    <nav class="navba blog-navba">
      <div class="nav-container">
        <div class="logo">
          <span>BlogSpace</span>
        </div>
        <h4 id="headish" class="blog-header-title">VIIR PHURIA &nbsp &nbsp BlogSpace</h4>
        <div class="nav-menu-wrapper">
          <ul class="nav-menu blog-nav-menu">
            <li class="nav-item">
              <a href="/#blog" class="nav-link">Home</a>
            </li>
            <li class="nav-item">
              <a href="/blogspace" class="nav-link">BlogSpace</a>
            </li>
            <li class="nav-item">
              <a href="/edit" class="nav-link">Write</a>
            </li>
          </ul>
        </div>
        <div class="hamburger">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
      </div>
    </nav>
  </header>

  <!-- ============================================================ -->
  <!-- CONTENT BLOCK -->
  <!-- ============================================================ -->
  {% block content %}
  {% endblock content %}

  <!-- ============================================================ -->
  <!-- VENDOR JS -->
  <!-- ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
    integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"
    integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD"
    crossorigin="anonymous"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

  <!-- Custom JS -->
  <script src="{% static 'js/blog-base.js' %}"></script>
  <script src="{% static 'js/blog-script.js' %}"></script>

</body>

</html>
